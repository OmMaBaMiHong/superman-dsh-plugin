# superman-dsh-plugin bundle patch：挂载 host 半（/s/api 应用 API · /s/app H5 · 调度 · agent 工具）。
# client 半由 package.json 的 dsh.client 声明，被 client-modules 扫描进 window.__DSH_BOOT__。
#
# 独立版默认行为（与 superman 应用内嵌版的差异）：
#   - storageMode: auto（无 SUPERMAN_DATABASE_URL 时自动用 PGlite 内嵌库，零配置本地可用）
#   - schedulerEnabled: true（独立版没有 Next.js worker，调度归插件；应用内嵌版默认 false 是
#     因为与应用 worker 互斥——独立版无此冲突）
#
# 可覆盖配置：
#   databaseUrl: Postgres 连接串（缺省读 SUPERMAN_DATABASE_URL / DATABASE_URL 环境变量，
#                再缺省走 PGlite 内嵌库 ~/.dsh/superman/pgdata）
#   heartbeatIntervalMs: 心跳间隔毫秒（缺省 60000，0 = 关闭）
#   schedulerEnabled: 调度器总开关（默认 true，SUPERMAN_SCHEDULER_ENABLED 可覆盖）
- insert:
    - id: superman
      name: 'superman'
